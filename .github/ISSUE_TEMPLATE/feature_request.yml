name: 功能建议
description: 提出新能力或改进建议
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 使用场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的 API / 方案
      description: 尽量给出 options 或组件 props 层面的伪代码
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案
      description: 是否可通过 nodeRenderer / linkPathGenerator / CSS 覆盖实现？
