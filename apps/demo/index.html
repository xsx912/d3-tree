<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双向树图谱 · 原生</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #fff; }
      header {
        display: flex; align-items: center; gap: 16px;
        padding: 10px 20px; border-bottom: 1px solid #EBEEF5;
      }
      header h1 { font-size: 16px; color: #303133; font-weight: 600; }
      nav a { font-size: 13px; color: #1E6EFF; text-decoration: none; margin-right: 12px; }
      nav a:hover { text-decoration: underline; }
      #toolbar {
        display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
        padding: 8px 20px; border-bottom: 1px solid #EBEEF5; background: #FAFAFA;
      }
      #toolbar button {
        padding: 5px 12px; font-size: 13px; border: 1px solid #DCDFE6; border-radius: 4px;
        background: #fff; color: #303133; cursor: pointer;
      }
      #toolbar button:hover { border-color: #1E6EFF; color: #1E6EFF; }
      #toolbar button.primary { background: #1E6EFF; border-color: #1E6EFF; color: #fff; }
      #toolbar button.primary:hover { opacity: 0.88; }
      #toolbar input {
        padding: 5px 10px; font-size: 13px; border: 1px solid #DCDFE6; border-radius: 4px;
        outline: none; width: 160px;
      }
      #toolbar input:focus { border-color: #1E6EFF; }
      #hint { font-size: 13px; color: #909399; }
      #hint.active { color: #E8684A; }
      #legend { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
      #legend .chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 3px 10px; font-size: 12px; color: #303133;
        border: 1px solid #DCDFE6; border-radius: 12px; cursor: pointer; user-select: none;
        background: #fff; transition: opacity 0.15s;
      }
      #legend .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
      #legend .chip.off { opacity: 0.35; text-decoration: line-through; }
      #chart { width: 100vw; height: calc(100vh - 96px); }
    </style>
  </head>
  <body>
    <header>
      <h1>双向树图谱 · 产业链示例</h1>
      <nav>
        <a href="/index.html">原生</a>
        <a href="/vue.html">Vue</a>
        <a href="/react.html">React</a>
      </nav>
    </header>
    <div id="toolbar">
      <button id="btn-add">追加子节点</button>
      <input id="node-name" placeholder="新节点名称" hidden />
      <button id="btn-confirm" class="primary" hidden>确认追加</button>
      <button id="btn-cancel" hidden>取消</button>
      <button id="btn-remove">删除节点</button>
      <span style="width: 1px; height: 18px; background: #DCDFE6;"></span>
      <input id="search-box" placeholder="搜索节点…" />
      <button id="btn-export-svg">导出 SVG</button>
      <button id="btn-export-png">导出 PNG</button>
      <span style="width: 1px; height: 18px; background: #DCDFE6;"></span>
      <button id="btn-expand">全展开</button>
      <button id="btn-collapse">全收起</button>
      <button id="btn-fit">适配视窗</button>
      <span id="hint">点击节点可折叠/展开；滚轮缩放、拖拽平移</span>
      <div id="legend"></div>
    </div>
    <div id="chart"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
