<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>d3-tree · 示例中心</title>
  </head>
  <body>
    <header class="slim">
      <h1>d3-tree 示例中心</h1>
      <div class="links">
        <a href="https://github.com/xsx912/d3-tree" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </header>
    <div id="layout">
      <aside id="sidebar" aria-label="示例目录"></aside>
      <main id="stage">
        <div id="canvas"></div>
        <div id="overlay" hidden></div>
        <div id="hint" hidden></div>
        <button id="panel-toggle" title="折叠/展开源码面板">›</button>
      </main>
      <aside id="panel" aria-label="示例说明与源码">
        <div id="panel-drag" title="拖动调整宽度"></div>
        <div id="panel-head">
          <div id="stack-tabs" role="tablist" aria-label="技术栈">
            <button data-stack="html" class="active" role="tab" aria-selected="true">原生</button>
            <button data-stack="vue" role="tab" aria-selected="false">Vue</button>
            <button data-stack="react" role="tab" aria-selected="false">React</button>
          </div>
          <span id="panel-title"></span>
          <button id="panel-copy">复制</button>
        </div>
        <p id="panel-desc"></p>
        <div id="file-tabs" role="tablist" aria-label="示例文件"></div>
        <div id="panel-code"><pre><code></code></pre></div>
      </aside>
    </div>
    <script type="module" src="/src/demos/main.ts"></script>
  </body>
</html>
