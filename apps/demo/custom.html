<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双向树图谱 · 自定义节点</title>
    <link rel="stylesheet" href="/src/toolbar.css" />
    <style>
      #mode-bar { display: flex; gap: 8px; align-items: center; padding: 8px 20px; border-bottom: 1px solid #EBEEF5; background: #FAFAFA; }
      #mode-bar button { padding: 5px 12px; font-size: 13px; border: 1px solid #DCDFE6; border-radius: 4px; background: #fff; cursor: pointer; color: #303133; }
      #mode-bar button.active { background: #1E6EFF; border-color: #1E6EFF; color: #fff; }
      #mode-bar span { font-size: 12px; color: #909399; }
      #chart { position: relative; }
    </style>
  </head>
  <body>
    <header>
      <h1>双向树图谱 · 节点完全自定义</h1>
      <nav>
        <a href="/index.html">原生</a>
        <a href="/vue.html">Vue</a>
        <a href="/react.html">React</a>
        <a href="/custom.html">自定义</a>
      </nav>
    </header>
    <div id="mode-bar">
      <button data-mode="default" class="active">默认样式</button>
      <button data-mode="card">HTML 卡片（nodeTemplate）</button>
      <button data-mode="icon">SVG 图标（nodeRenderer）</button>
      <span id="mode-hint">切换模式对比三种节点渲染方式；折叠/搜索/导出在任意模式下可用</span>
    </div>
    <div id="chart"></div>
    <script type="module" src="/src/custom-page/main.ts"></script>
  </body>
</html>
